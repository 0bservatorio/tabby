appId: org.tabby
asarUnpack:
- dist/*.map
- node_modules/keytar/build/Release/*.node
- node_modules/**/*.node
compression: normal
deb:
  afterInstall: build/linux/after-install.tpl
  depends:
  - gnome-keyring
  - libnotify4
  - libsecret-1-0
  - libxtst6
  - libnss3
  fpm:
  - --replaces
  - terminus-terminal
electronFuses:
  enableNodeCliInspectArguments: false
  enableNodeOptionsEnvironmentVariable: false
  runAsNode: false
extraResources:
- builtin-plugins
- extras
files:
- '**/*'
- dist
- '!lib'
- '!src'
- '!**/node_modules/*/{CHANGELOG.md,README.md,README,readme.md,readme,node.lib}'
- '!**/node_modules/*/{test,__tests__,tests,powered-test,example,examples,docs}'
- '!**/node_modules/@angular/common/locales'
- '!**/node_modules/@angular/compiler/src'
- '!**/node_modules/node-gyp'
- '!**/node_modules/**/*.d.ts'
- '!**/node_modules/**/*.map'
- '!**/node_modules/**/include/node'
- '!**/node_modules/.bin'
- '!**/node_modules/*/*/{esm5,fesm5,esm2015,fesm2015,_esm2015,_fesm2015}'
- '!**/*.{woff,ttf,otf,eot}'
- '!**/*.{iml,o,hprof,orig,pyc,pyo,rbc,swp,csproj,sln,xproj}'
- '!.editorconfig'
- '!**/._*'
- '!**/{.DS_Store,.git,.hg,.svn,CVS,RCS,SCCS,.gitignore,.gitattributes}'
- '!**/{__pycache__,thumbs.db,.flowconfig,.idea,.vs,.nyc_output}'
- '!**/{appveyor.yml,.travis.yml,circle.yml}'
- '!**/{npm-debug.log,yarn.lock,.yarn-integrity,.yarn-metadata.json}'
- '!**/deps/cpu_features/build'
linux:
  artifactName: tabby-${version}-linux-${env.ARCH}.${ext}
  category: Utility;TerminalEmulator;System
  desktop:
    entry:
      MimeType: x-scheme-handler/tabby
      StartupWMClass: tabby
  executableArgs:
  - --no-sandbox
  icon: ./build/icons
mac:
  artifactName: tabby-${version}-macos-${env.ARCH}.${ext}
  category: public.app-category.utilities
  entitlements: ./build/mac/entitlements.plist
  entitlementsInherit: ./build/mac/entitlements.plist
  extendInfo:
    ElectronTeamID: ${teamId}
    NSAppleEventsUsageDescription: A subprocess requests permission to send AppleScript
      events to another application.
    NSCameraUsageDescription: A subprocess requests access to the device's camera.
    NSDesktopFolderUsageDescription: A subprocess requests access to the user's Desktop
      folder.
    NSDocumentsFolderUsageDescription: A subprocess requests access to the user's
      Documents folder.
    NSDownloadsFolderUsageDescription: A subprocess requests access to the user's
      Downloads folder.
    NSLocationUsageDescription: A subprocess requests access to the user's location
      information.
    NSMicrophoneUsageDescription: A subprocess requests access to the device's microphone.
    NSNetworkVolumesUsageDescription: A subprocess requests access to files on a network
      volume.
    NSRemovableVolumesUsageDescription: A subprocess requests access to files on a
      removable volume.
    NSRequiresAquaSystemAppearance: false
  hardenedRuntime: true
  icon: ./build/mac/icon.icns
npmRebuild: false
nsis:
  allowToChangeInstallationDirectory: true
  artifactName: tabby-${version}-setup-${env.ARCH}.${ext}
  installerIcon: ./build/windows/icon.ico
  oneClick: false
  shortcutName: Tabby Terminal
pacman:
  depends:
  - gnome-keyring
  - libsecret
productName: Tabby
protocols:
- name: Tabby URL
  schemes:
  - tabby
rpm:
  depends:
  - gnome-keyring
  fpm:
  - --rpm-rpmbuild-define
  - _build_id_links none
  - --replaces
  - terminus-terminal
snap:
  plugs:
  - default
  - system-files
  - system-observe
win:
  artifactName: tabby-${version}-portable-${env.ARCH}.${ext}
  cscLink: null
  icon: ./build/windows/icon.ico
  signtoolOptions:
    rfc3161TimeStampServer: http://timestamp.sectigo.com
